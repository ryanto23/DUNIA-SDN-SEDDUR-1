  <body>
  <header>
    <h1>🏫 DUNIA SDN SEDDUR 1</h1>
    <p>Kurikulum Merdeka • Tahun Ajaran 2026/2027</p>
  </header>
  <div class="container" id="app"></div>
  <script>
    window.DATA_SEDDUR = {};
    window.DATA_UJIAN = {};
    window.KODE_UJIAN_DEFAULT = {
      "1": "KLS1-2026",
      "2": "KLS2-2026",
      "3": "KLS3-2026",
      "4": "KLS4-2026",
      "5": "KLS5-2026",
      "6": "KLS6-2026"
    };
  </script>
  <script src="kode_ujian.js?v=2026"></script>
  <script src="kelas1.js?v=2026"></script>
  <script src="kelas2.js?v=2026"></script>
  <script src="kelas3.js?v=2026"></script>
  <script src="kelas4.js?v=2026"></script>
  <script src="kelas5.js?v=2026"></script>
  <script src="kelas6.js?v=2026"></script>
  <script src="ujian1.js?v=2026"></script>
  <script src="ujian2.js?v=2026"></script>
  <script src="ujian3.js?v=2026"></script>
  <script src="ujian4.js?v=2026"></script>
  <script src="ujian5.js?v=2026"></script>
  <script src="ujian6.js?v=2026"></script>
  <script>
    let audioCtx = null;
    let audioCadangan = new Audio();
    audioCadangan.preload = "auto";
    function bukaKunciAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function mainkanEfek(jenis) {
      if (modeAplikasi === "ujian") return;
      bukaKunciAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (jenis === 'benar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc.start(now); osc.stop(now + 0.55);
      } else if (jenis === 'salah') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (jenis === 'klik') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(620, now);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    }

        function ucapkan(teks) {
      if (modeAplikasi === "ujian") return;
      bukaKunciAudio();
      if (!teks) return;
      try { audioCadangan.pause(); } catch (e) {}
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          const daftarSuara = window.speechSynthesis.getVoices();
          const suaraIndo = daftarSuara.find(v => v.lang.toLowerCase().includes('id') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Gadis'))) || daftarSuara.find(v => v.lang.toLowerCase().includes('id'));
          if (!isMobile || suaraIndo) {
            const u = new SpeechSynthesisUtterance(teks);
            u.lang = "id-ID";
            if (suaraIndo) u.voice = suaraIndo;
            u.rate = 0.97; u.pitch = 1.05; u.volume = 1.0;
            u.onerror = () => putarSuaraOnline(teks);
            window.speechSynthesis.speak(u);
            return;
          }
        } catch (err) {}
      }
      putarSuaraOnline(teks);
    }
    function putarSuaraOnline(teks) {
      try {
        const bersih = teks.replace(/[^\w\s.,?!-]/gi, '').slice(0, 180);
        audioCadangan.src = `https://google.com{encodeURIComponent(bersih)}`;
        audioCadangan.play().catch(() => {});
      } catch (e) {}
    }
    function acakArray(arr) {
      const salinan = [...arr];
      for (let i = salinan.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [salinan[i], salinan[j]] = [salinan[j], salinan[i]];
      }
      return salinan;
    }

    let modeAplikasi = "kuis";
    let namaSiswa = "Siswa Hebat";
    let kelasAktif = 1;
    let mapelAktif = "";
    let babAktif = 0;
    let kodeKategoriUjianAktif = "";
    let kategoriUjianAktif = "";
    let mapelUjianAktif = "";
    let soalPermainan = [];
    let jawabanSiswaUjian = [];
    let indeksSoal = 0;
    let skorTotal = 0;
    let jumlahBenar = 0;
    let comboBenar = 0;
    let sudahMenjawab = false;
    let timerInterval = null;
    let sisaDetik = 0;

    const daftarNamaMapel = {
      pancasila: { judul: "Pendidikan Pancasila", ikon: "🦅", kelasCss: "m-pancasila" },
      bindo: { judul: "Bahasa Indonesia", ikon: "📚", kelasCss: "m-bindo" },
      mtk: { judul: "Matematika", ikon: "🔢", kelasCss: "m-mtk" },
      ipas: { judul: "IPAS (Alam & Sosial)", ikon: "🌍", kelasCss: "m-ipas" },
      bing: { judul: "Bahasa Inggris", ikon: "🔤", kelasCss: "m-bing" }
    };

    const daftarKategoriUjian = [
      { kode: "uts_1", judul: "UTS Semester 1", waktuInfo: "90 Menit Total", ikon: "📘", warna: "m-bindo" },
      { kode: "uas_1", judul: "UAS Semester 1", waktuInfo: "90 Menit Total", ikon: "📙", warna: "m-pancasila" },
      { kode: "uts_2", judul: "UTS Semester 2", waktuInfo: "90 Menit Total", ikon: "📗", warna: "m-mtk" },
      { kode: "uas_2", judul: "UAS Semester 2", waktuInfo: "90 Menit Total", ikon: "📕", warna: "m-bing" }
    ];

        function hentikanTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function formatWaktu(detik) {
      const m = Math.floor(detik / 60);
      const s = detik % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function getKodeUjianKelas(kls) {
      const key = String(kls);
      if (window.KODE_UJIAN_DEFAULT && window.KODE_UJIAN_DEFAULT[key]) {
        return String(window.KODE_UJIAN_DEFAULT[key]).trim().toUpperCase();
      }
      if (window.KODE_UJIAN_DEFAULT && window.KODE_UJIAN_DEFAULT[kls]) {
        return String(window.KODE_UJIAN_DEFAULT[kls]).trim().toUpperCase();
      }
      return `KLS${kls}-2026`;
    }

    function getDataUjianKelasAman(kls) {
      const key = String(kls);
      if (!window.DATA_UJIAN[key] && !window.DATA_UJIAN[kls]) {
        window.DATA_UJIAN[key] = { bab: { pancasila: [], bindo: [], mtk: [], ipas: [], bing: [] }, uts_1: [], uas_1: [], uts_2: [], uas_2: [] };
      }
      return window.DATA_UJIAN[key] || window.DATA_UJIAN[kls];
    }

    function getPasswordAdmin() {
      try { return localStorage.getItem("seddur_admin_pass") || "admin123"; } catch (e) { return "admin123"; }
    }

    function simpanRekapNilai(record) {
      try {
        const list = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]");
        list.push(record);
        localStorage.setItem("seddur_rekap_nilai", JSON.stringify(list));
      } catch (e) {}
    }

    function getDaftarBabSinkron(kls, kodeMapel) {
      const gabungan = [];
      const dariKuis = (window.DATA_SEDDUR[kls] && window.DATA_SEDDUR[kls][kodeMapel]) || [];
      const dataUjianKls = getDataUjianKelasAman(kls);
      const dariUjian = (dataUjianKls.bab && dataUjianKls.bab[kodeMapel]) || [];

      dariKuis.forEach(b => {
        const kunciBab = b.bab.trim().toLowerCase();
        const semuaPaketCocok = dariUjian.filter(u => u.bab && u.bab.trim().toLowerCase() === kunciBab);
        let soalTergabung = [];
        semuaPaketCocok.forEach(pkt => {
          if (Array.isArray(pkt.soal)) soalTergabung = soalTergabung.concat(pkt.soal);
        });
        gabungan.push({
          semester: b.semester || "Semester 1/2",
          bab: b.bab,
          soalUjian: soalTergabung
        });
      });

      dariUjian.forEach(u => {
        if (!u.bab) return;
        const kunciBab = u.bab.trim().toLowerCase();
        const indexSudahAda = gabungan.findIndex(g => g.bab.trim().toLowerCase() === kunciBab);
        if (indexSudahAda === -1) {
          const semuaPaketBaru = dariUjian.filter(item => item.bab && item.bab.trim().toLowerCase() === kunciBab);
          let soalTergabung = [];
          semuaPaketBaru.forEach(pkt => {
            if (Array.isArray(pkt.soal)) soalTergabung = soalTergabung.concat(pkt.soal);
          });
          gabungan.push({
            semester: u.semester || "Ujian Bab",
            bab: u.bab,
            soalUjian: soalTergabung
          });
        }
      });

      return gabungan;
    }

        function tampilBeranda() {
      hentikanTimer();
      document.body.classList.remove("mode-cbt");
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
      document.getElementById("app").innerHTML = `
        <div class="card">

        function mulaiUjianBabSpesifik(kodeMapel, idxBab) {
      const infoMapel = daftarNamaMapel[kodeMapel];
      const daftarBab = getDaftarBabSinkron(kelasAktif, kodeMapel);
      const targetBab = daftarBab[idxBab];

      if (!targetBab || !targetBab.soalUjian || targetBab.soalUjian.length === 0) {
        alert(`Belum ada soal ujian untuk "${targetBab ? targetBab.bab : 'Bab ini'}" pada file ujian${kelasAktif}.js!`);
        return;
      }

      if (!confirm(`Mulai Ujian Bab sekarang?\n• Peserta: ${namaSiswa}\n• Mapel: ${infoMapel.judul}\n• Materi: ${targetBab.bab}\n• Jumlah Soal: ${targetBab.soalUjian.length} soal\n• Batas Waktu: 5 menit per soal`)) return;

      modeAplikasi = "ujian";
      kodeKategoriUjianAktif = "latihan_bab";
      mapelUjianAktif = infoMapel.judul;
      kategoriUjianAktif = targetBab.bab;

      jalankanMesinCBT(targetBab.soalUjian);
    }

    function mulaiUjianUTS_UAS(kodeKat, judulKat) {
      const dataUjianKelas = getDataUjianKelasAman(kelasAktif);
      const daftarSoal = dataUjianKelas[kodeKat] || [];
      if (daftarSoal.length === 0) {
        alert(`Belum ada soal di paket "${judulKat}" pada file ujian${kelasAktif}.js!`);
        return;
      }

      if (!confirm(`Mulai ${judulKat} sekarang?\n• Peserta: ${namaSiswa}\n• Jumlah Soal: ${daftarSoal.length} soal\n• Batas Waktu: 90 menit total`)) return;

      modeAplikasi = "ujian";
      kodeKategoriUjianAktif = kodeKat;
      mapelUjianAktif = (daftarSoal && daftarSoal.mapel) ? daftarSoal.mapel : "Umum / Tematik";
      kategoriUjianAktif = judulKat;

      jalankanMesinCBT(daftarSoal);
    }

    function jalankanMesinCBT(daftarSoalMentah) {
      soalPermainan = acakArray(daftarSoalMentah).map(item => {
        const jawabanBenar = item.opsi[item.kunci];
        const opsiAcak = acakArray(item.opsi);
        return {
          ikon: item.ikon || "",
          tanya: item.tanya,
          opsi: opsiAcak,
          kunci: opsiAcak.indexOf(jawabanBenar)
        };
      });

      jawabanSiswaUjian = new Array(soalPermainan.length).fill(null);
      indeksSoal = 0;

      hentikanTimer();
      if (kodeKategoriUjianAktif === "latihan_bab") {
        mulaiTimerPerSoalBab();
      } else {
        sisaDetik = 90 * 60;
        timerInterval = setInterval(() => {
          sisaDetik--;
          const elTimer = document.getElementById("tampilanTimer");
          if (elTimer) elTimer.textContent = formatWaktu(sisaDetik);
          if (sisaDetik <= 0) {
            hentikanTimer();
            alert("⏰ Waktu ujian 90 menit telah habis! Jawaban Anda otomatis dikumpulkan.");
            selesaiDanKumpulkanUjian(true);
          }
        }, 1000);
      }

      renderSoalUjianCBT();
    }

    function mulaiTimerPerSoalBab() {
      hentikanTimer();
      sisaDetik = 5 * 60;
      timerInterval = setInterval(() => {
        sisaDetik--;
        const elTimer = document.getElementById("tampilanTimer");
        if (elTimer) elTimer.textContent = formatWaktu(sisaDetik);
        if (sisaDetik <= 0) {
          hentikanTimer();
          if (indeksSoal < soalPermainan.length - 1) {
            indeksSoal++;
            mulaiTimerPerSoalBab();
            renderSoalUjianCBT();
          } else {
            alert("⏰ Waktu soal terakhir telah habis! Ujian selesai.");
            selesaiDanKumpulkanUjian(true);
          }
        }
      }, 1000);
    }

    function renderSoalUjianCBT() {
      const s = soalPermainan[indeksSoal];
      const hurufOpsi = ["A", "B", "C", "D"];
      const isBab = kodeKategoriUjianAktif === "latihan_bab";

      let navNomorHTML = soalPermainan.map((_, idx) => {
        const clsAktif = idx === indeksSoal ? "aktif" : "";
        const clsTerjawab = jawabanSiswaUjian[idx] !== null ? "terjawab" : "";
        const onclickAttr = isBab ? "" : `onclick="pindahNomorUjian(${idx})"`;
        const styleLocked = isBab && idx !== indeksSoal ? "opacity:0.55; cursor:not-allowed;" : "";
        return `<button class="nav-nomor-btn ${clsAktif} ${clsTerjawab}" ${onclickAttr} style="${styleLocked}">${idx + 1}</button>`;
      }).join("");

      let opsiHTML = s.opsi.map((teks, idx) => {
        const terpilih = jawabanSiswaUjian[indeksSoal] === idx ? "cbt-opsi-terpilih" : "";
        return `
          <button class="cbt-opsi-item ${terpilih}" onclick="pilihJawabanUjian(${idx})">
            <span class="cbt-huruf">${hurufOpsi[idx]}</span>
            <span>${teks}</span>
          </button>`;
      }).join("");

      const tombolSebelumnya = (!isBab && indeksSoal > 0)
        ? `<button class="bg-kembali" onclick="pindahNomorUjian(${indeksSoal - 1})">⬅️ Sebelumnya</button>`
        : `<div></div>`;

      const tombolBerikutnya = (indeksSoal < soalPermainan.length - 1)
        ? `<button class="btn-aksi" style="margin:0; background:#2563eb; box-shadow:none;" onclick="lanjutNomorUjian()">Soal Berikutnya ➡️</button>`
        : `<button class="btn-aksi btn-sukses" style="margin:0; box-shadow:none;" onclick="selesaiDanKumpulkanUjian(false)">✅ Selesai & Kumpulkan</button>`;

      document.getElementById("app").innerHTML = `
        <div class="cbt-header-info">
          <div>
            <div style="font-weight:700;">${mapelUjianAktif} • ${kategoriUjianAktif}</div>
            <div style="font-size:0.75rem; opacity:0.85;">Peserta: ${namaSiswa} (Kelas ${kelasAktif})</div>
          </div>
          <div class="timer-box" id="tampilanTimer">${formatWaktu(sisaDetik)}</div>
        </div>

        <div class="nav-nomor-grid">${navNomorHTML}</div>

        <div class="card card-cbt">
          <div style="display:flex; justify-content:space-between; font-size:0.84rem; font-weight:700; color:#475569;">
            <span>SOAL NOMOR ${indeksSoal + 1} DARI ${soalPermainan.length}</span>
            <span>${jawabanSiswaUjian[indeksSoal] !== null ? '✅ Terjawab' : '⬜ Belum dijawab'}</span>
          </div>

          <div class="cbt-soal-teks">
            ${s.ikon ? `<div style="font-size:2rem; margin-bottom:6px;">${s.ikon}</div>` : ''}
            ${s.tanya}
          </div>

          <div class="cbt-opsi-list">${opsiHTML}</div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:12px; border-top:1px solid #e2e8f0;">
            ${tombolSebelumnya}
            ${tombolBerikutnya}
          </div>
        </div>`;
    }

        function pilihJawabanUjian(idxOpsi) {
      jawabanSiswaUjian[indeksSoal] = idxOpsi;
      renderSoalUjianCBT();
    }

    function pindahNomorUjian(idxTujuan) {
      if (kodeKategoriUjianAktif === "latihan_bab") return;
      indeksSoal = idxTujuan;
      renderSoalUjianCBT();
    }

    function lanjutNomorUjian() {
      if (kodeKategoriUjianAktif === "latihan_bab") {
        if (jawabanSiswaUjian[indeksSoal] === null) {
          if (!confirm("Soal ini belum dijawab dan tidak bisa kembali ke nomor sebelumnya. Lanjut ke soal berikutnya?")) return;
        }
        indeksSoal++;
        mulaiTimerPerSoalBab();
      } else {
        indeksSoal++;
      }
      renderSoalUjianCBT();
    }

    function selesaiDanKumpulkanUjian(otomatis) {
      const belumDijawab = jawabanSiswaUjian.filter(j => j === null).length;
      if (!otomatis) {

        function buatKodeSoalGitHub() {
      const kls = document.getElementById("genKelas").value;
      const mapelRaw = document.getElementById("genMapel").value.split("|");
      const kodeMapel = mapelRaw;
      const namaMapel = mapelRaw;
      const katRaw = document.getElementById("genKategori").value.split("|");
      const katKode = katRaw;
      const katNama = katRaw;
      const judulBab = document.getElementById("genDaftarBab").value;
      const topik = document.getElementById("genTopik").value.trim() || judulBab;
      const modeGbr = document.getElementById("genModeGambar").value;
      const jumlah = parseInt(document.getElementById("genJumlah").value, 10);

      let contohOpsi = `["Pilihan A", "Pilihan B", "Pilihan C", "Pilihan D"]`;
      if (modeGbr.includes("Jawaban Gambar")) {
        contohOpsi = `["🍎 Apel", "🍌 Pisang", "🍇 Anggur", "🍉 Semangka"]`;
      }

      let kodePembungkus = "";
      if (katKode === "bab") {
        kodePembungkus = `window.DATA_UJIAN["${kls}"].bab.${kodeMapel}.push({\n  semester: "Semester 1",\n  bab: "${judulBab}",\n  soal: [\n    {\n      ikon: "📝",\n      tanya: "Pertanyaan...",\n      opsi: ${contohOpsi},\n      kunci: 0,\n      bahas: "Pembahasan."\n    }\n  ]\n});`;
      } else {
        kodePembungkus = `window.DATA_UJIAN["${kls}"].${katKode}.push(\n  {\n    mapel: "${namaMapel}",\n    ikon: "📝",\n    tanya: "Pertanyaan...",\n    opsi: ${contohOpsi},\n    kunci: 0,\n    bahas: "Pembahasan."\n  }\n);`;
      }

      const promptAI = `Buatkan ${jumlah} soal pilihan ganda Kurikulum Merdeka Tahun Ajaran 2026/2027 untuk siswa SD Kelas ${kls}.\n- Mata Pelajaran: ${namaMapel}\n- Kategori: ${katKode === "bab" ? judulBab : katNama}\n- Topik Materi: ${topik}\n- Format Tampilan: ${modeGbr}\n\nATURAN WAJIB FORMAT OUTPUT:\nTuliskan HANYA dalam bentuk kode JavaScript berikut tanpa teks pembuka/penutup agar bisa langsung saya tempel di BARIS PALING BAWAH file ujian${kls}.js:\n\n${kodePembungkus}\n\nPastikan seluruh ${jumlah} soal dimasukkan ke dalam blok tersebut, indeks "kunci" (0=A, 1=B, 2=C, 3=D) akurat, dan gunakan emoji visual sesuai mode gambar.`;

      let daftarTemplate = [];
      for (let i = 1; i <= jumlah; i++) {
        const barisMapel = katKode === "bab" ? "" : `\n    mapel: "${namaMapel}",`;
        daftarTemplate.push(`  {${barisMapel}\n    ikon: "📝",\n    tanya: "Soal nomor ${i} (${namaMapel} - ${topik})...",\n    opsi: ${contohOpsi},\n    kunci: 0,\n    bahas: "Pembahasan soal nomor ${i}."\n  }`);
      }

      const kodeGitHub = katKode === "bab"
        ? `// Tempelkan di BARIS PALING BAWAH file ujian${kls}.js\nwindow.DATA_UJIAN["${kls}"].bab.${kodeMapel}.push({\n  semester: "Semester 1",\n  bab: "${judulBab}",\n  soal: [\n${daftarTemplate.join(",\n")}\n  ]\n});`
        : `// Tempelkan di BARIS PALING BAWAH file ujian${kls}.js\nwindow.DATA_UJIAN["${kls}"].${katKode}.push(\n${daftarTemplate.join(",\n")}\n);`;

      document.getElementById("hasilPromptAI").value = promptAI;
      document.getElementById("hasilKodeSoal").value = kodeGitHub;
      mainkanEfek('benar');
    }

          <div id="infoRingkasanFilter" style="margin-top:10px; font-size:0.82rem; font-weight:700; color:#0f172a; background:#e0f2fe; padding:6px 10px; border-radius:10px;"></div>
          <div id="wadahTabelNilai"></div>
        </div>`;
      renderTabelNilai();
    }

    function getDataTersaring() {
      let semua = [];
      try { semua = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]"); } catch (e) {}
      const fKelas = document.getElementById("filterKelas").value;
      const fMapel = document.getElementById("filterMapel").value;
      const fKat = document.getElementById("filterKategori").value;

      return semua.filter(item => {
        const mapelItem = item.mapel || "Umum / Tematik";
        const cocokKelas = (fKelas === "ALL") || (String(item.kelas) === fKelas);
        const cocokMapel = (fMapel === "ALL") || (mapelItem === fMapel);
        let cocokKat = true;
        if (fKat === "HANYA_BAB") {
          cocokKat = !["UTS Semester 1", "UAS Semester 1", "UTS Semester 2", "UAS Semester 2"].includes(item.kategori);
        } else if (fKat !== "ALL") {
          cocokKat = (item.kategori === fKat);
        }
        return cocokKelas && cocokMapel && cocokKat;
      });
    }

    function renderTabelNilai() {
      const data = getDataTersaring();
      const wadah = document.getElementById("wadahTabelNilai");
      const infoBox = document.getElementById("infoRingkasanFilter");
      const fKelas = document.getElementById("filterKelas").value;
      const fMapel = document.getElementById("filterMapel").value;
      const fKat = document.getElementById("filterKategori").value;

      infoBox.textContent = `Menampilkan ${data.length} data • Kelas: ${fKelas === 'ALL' ? 'Semua' : 'Kelas ' + fKelas} • Mapel: ${fMapel === 'ALL' ? 'Semua' : fMapel} • Ujian: ${fKat === 'ALL' ? 'Semua' : (fKat === 'HANYA_BAB' ? 'Ujian Bab' : fKat)}`;

      if (data.length === 0) {
        wadah.innerHTML = `<p style="margin-top:14px; color:#64748b; font-size:0.88rem;">Tidak ada data nilai yang cocok dengan kombinasi filter di atas.</p>`;
        return;
      }

      let rows = data.map((d, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><strong>${d.nama}</strong><br><span style="font-size:0.72rem; color:#64748b;">${d.tanggal}</span></td>
          <td>Kls ${d.kelas}</td>
          <td>${d.mapel || 'Umum / Tematik'}</td>
          <td>${d.kategori}</td>
          <td>${d.benar}</td>
          <td><strong style="color:#0284c7;">${d.nilai}</strong></td>
        </tr>`).join("");

      wadah.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>No</th><th>Nama Siswa</th><th>Kelas</th><th>Mata Pelajaran</th><th>Materi / Jenis</th><th>Benar</th><th>Nilai</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

        function downloadExcelTerfilter() {
      const data = getDataTersaring();
      if (data.length === 0) { alert("Tidak ada data pada filter yang dipilih untuk diunduh!"); return; }

      const fKelas = document.getElementById("filterKelas").value;
      const fMapel = document.getElementById("filterMapel").value;
      const fKat = document.getElementById("filterKategori").value;

      let csvContent = "No,Tanggal,Nama Siswa,Kelas,Mata Pelajaran,Materi / Jenis Ujian,Jawaban Benar,Nilai Akhir\n";
      data.forEach((d, idx) => {
        const namaAman = `"${String(d.nama).replace(/"/g, '""')}"`;
        const tglAman = `"${String(d.tanggal).replace(/"/g, '""')}"`;
        const mapelAman = `"${String(d.mapel || 'Umum / Tematik').replace(/"/g, '""')}"`;
        const katAman = `"${String(d.kategori).replace(/"/g, '""')}"`;
        const benarAman = `"${String(d.benar)}"`;
        csvContent += `${idx + 1},${tglAman},${namaAman},Kelas ${d.kelas},${mapelAman},${katAman},${benarAman},${d.nilai}\n`;
      });

      const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const labelKelas = fKelas === "ALL" ? "SemuaKelas" : `Kelas${fKelas}`;
      const labelMapel = fMapel === "ALL" ? "SemuaMapel" : fMapel.replace(/[^a-zA-Z0-9]/g, "_");
      const labelKat = fKat === "ALL" ? "SemuaUjian" : fKat.replace(/[^a-zA-Z0-9]/g, "_");

      link.setAttribute("href", url);
      link.setAttribute("download", `Rekap_Nilai_${labelKelas}_${labelMapel}_${labelKat}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function hapusDataHasilFilter() {
      const tersaring = getDataTersaring();
      if (tersaring.length === 0) { alert("Tidak ada data pada filter ini untuk dihapus."); return; }
      if (!confirm(`Yakin ingin menghapus ${tersaring.length} data nilai yang tampil pada filter ini?`)) return;
      let semua = [];
      try { semua = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]"); } catch (e) {}
      const idDihapus = new Set(tersaring.map(item => item.id));
      try { localStorage.setItem("seddur_rekap_nilai", JSON.stringify(semua.filter(item => !idDihapus.has(item.id)))); } catch (e) {}
      mainkanEfek('salah'); renderTabelNilai(); alert("✅ Data hasil filter berhasil dihapus!");
    }

        function adminUbahPassword() {
      document.getElementById("app").innerHTML = `
        <div class="top-bar"><button class="bg-kembali" onclick="tampilDashboardAdmin()">⬅️ Dashboard</button><div class="star-bar">🔑 Ubah Password</div></div>
        <div class="card">
          <h3 style="color:#0284c7;">Ubah Password Admin</h3>
          <p style="font-size:0.82rem; color:#64748b; margin-bottom:10px;">Gunakan password yang mudah diingat oleh guru/admin</p>
          <input type="password" id="passLama" class="input-nama" placeholder="Password Lama..." />
          <input type="password" id="passBaru" class="input-nama" placeholder="Password Baru..." />
          <input type="password" id="passKonfirm" class="input-nama" placeholder="Ulangi Password Baru..." />
          <button class="btn-aksi btn-sukses" style="width:100%; margin-top:10px;" onclick="simpanPasswordBaru()">💾 Simpan Password Baru</button>
        </div>`;
    }

    function simpanPasswordBaru() {
      const lama = document.getElementById("passLama").value;
      const baru = document.getElementById("passBaru").value.trim();
      const konfirm = document.getElementById("passKonfirm").value.trim();
      if (lama !== getPasswordAdmin()) { alert("Password lama tidak sesuai!"); return; }
      if (baru.length < 4) { alert("Password baru minimal 4 karakter!"); return; }
      if (baru !== konfirm) { alert("Konfirmasi password baru tidak cocok!"); return; }
      try { localStorage.setItem("seddur_admin_pass", baru); } catch (e) {}
      mainkanEfek('benar'); alert("✅ Password Admin berhasil diubah!"); tampilDashboardAdmin();
    }

    tampilBeranda();
  </script>
