  <script>
    let audioCtx = null;
    let audioCadangan = new Audio();
    audioCadangan.preload = "auto";
    function bukaKunciAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function mainkanEfek(jenis) {
      bukaKunciAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (jenis === 'benar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc.start(now); osc.stop(now + 0.55);
      } else if (jenis === 'salah') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (jenis === 'klik') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(620, now);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    }

        function ucapkan(teks) {
      bukaKunciAudio();
      if (!teks) return;
      try { audioCadangan.pause(); } catch (e) {}
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          const daftarSuara = window.speechSynthesis.getVoices();
          const suaraIndo = daftarSuara.find(v => v.lang.toLowerCase().includes('id') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Gadis'))) || daftarSuara.find(v => v.lang.toLowerCase().includes('id'));
          if (!isMobile || suaraIndo) {
            const u = new SpeechSynthesisUtterance(teks);
            u.lang = "id-ID";
            if (suaraIndo) u.voice = suaraIndo;
            u.rate = 0.97; u.pitch = 1.05; u.volume = 1.0;
            u.onerror = () => putarSuaraOnline(teks);
            window.speechSynthesis.speak(u);
            return;
          }
        } catch (err) {}
      }
      putarSuaraOnline(teks);
    }
    function putarSuaraOnline(teks) {
      try {
        const bersih = teks.replace(/[^\w\s.,?!-]/gi, '').slice(0, 180);
        audioCadangan.src = `https://google.com{encodeURIComponent(bersih)}`;
        audioCadangan.play().catch(() => {});
      } catch (e) {}
    }
    function acakArray(arr) {
      const salinan = [...arr];
      for (let i = salinan.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [salinan[i], salinan[j]] = [salinan[j], salinan[i]];
      }
      return salinan;
    }

    let modeAplikasi = "kuis";
    let namaSiswa = "Siswa Hebat";
    let kelasAktif = 1;
    let mapelAktif = "";
    let babAktif = 0;
    let kategoriUjianAktif = "";
    let soalPermainan = [];
    let indeksSoal = 0;
    let skorTotal = 0;
    let jumlahBenar = 0;
    let comboBenar = 0;
    let sudahMenjawab = false;

    const daftarNamaMapel = {
      pancasila: { judul: "Pendidikan Pancasila", ikon: "🦅", kelasCss: "m-pancasila" },
      bindo: { judul: "Bahasa Indonesia", ikon: "📚", kelasCss: "m-bindo" },
      mtk: { judul: "Matematika", ikon: "🔢", kelasCss: "m-mtk" },
      ipas: { judul: "IPAS (Alam & Sosial)", ikon: "🌍", kelasCss: "m-ipas" },
      bing: { judul: "Bahasa Inggris", ikon: "🔤", kelasCss: "m-bing" }
    };

    const daftarKategoriUjian = [
      { kode: "latihan_bab", judul: "Latihan Bab", ikon: "📝", warna: "m-ipas" },
      { kode: "uts_1", judul: "UTS Semester 1", ikon: "📘", warna: "m-bindo" },
      { kode: "uas_1", judul: "UAS Semester 1", ikon: "📙", warna: "m-pancasila" },
      { kode: "uts_2", judul: "UTS Semester 2", ikon: "📗", warna: "m-mtk" },
      { kode: "uas_2", judul: "UAS Semester 2", ikon: "📕", warna: "m-bing" }
    ];

        function getKodeUjianKelas(kls) {
      const data = JSON.parse(localStorage.getItem("seddur_kode_ujian") || "{}");
      return data[kls] || "";
    }
    function setKodeUjianKelas(kls, kode) {
      const data = JSON.parse(localStorage.getItem("seddur_kode_ujian") || "{}");
      data[kls] = kode.trim().toUpperCase();
      localStorage.setItem("seddur_kode_ujian", JSON.stringify(data));
    }
    function getPasswordAdmin() {
      return localStorage.getItem("seddur_admin_pass") || "admin123";

    function simpanRekapNilai(record) {
      const list = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]");
      list.push(record);
      localStorage.setItem("seddur_rekap_nilai", JSON.stringify(list));
    }

    function tampilBeranda() {
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
      document.getElementById("app").innerHTML = `

          <p style="color:#64748b; font-size:0.86rem; margin-top:4px;">Silakan pilih menu belajar atau evaluasi di bawah ini</p>
        </div>
        <div class="mode-grid">
          <button class="mode-btn mode-kuis" onclick="bukaMenuKelasKuis()">
            <div>
              <div>🎮 MENU KUIS</div>
              <div style="font-size:0.78rem; font-weight:400; opacity:0.9;">Latihan interaktif Kelas 1 - 6</div>
            </div>
            <span style="font-size:1.6rem;">▶️</span>
          </button>
          <button class="mode-btn mode-ujian" onclick="bukaMenuKelasUjian()">
            <div>
              <div>📝 MENU UJIAN</div>
              <div style="font-size:0.78rem; font-weight:400; opacity:0.9;">Latihan Bab, UTS & UAS (Pakai Kode)</div>
            </div>
            <span style="font-size:1.6rem;">🔐</span>
          </button>
          <button class="mode-btn mode-admin" onclick="tampilLoginAdmin()">
            <div>
              <div>⚙️ MENU ADMIN</div>
              <div style="font-size:0.75rem; font-weight:400; opacity:0.8;">Kode Ujian, Generator AI & Rekap Nilai</div>
            </div>
            <span>🔑</span>
          </button>
        </div>`;
    }

        function bukaMenuKelasKuis() {
      mainkanEfek('klik');
      modeAplikasi = "kuis";
      namaSiswa = "Siswa Hebat";
      document.getElementById("app").innerHTML = `
        <div class="top-bar"><button class="bg-kembali" onclick="tampilBeranda()">⬅️ Menu Awal</button><div class="star-bar">🎮 Mode Kuis</div></div>
        <div class="card"><h2 style="color:#0284c7; font-size:1.2rem;">Pilih Kelas (Menu Kuis)</h2><p style="color:#64748b; font-size:0.84rem;">Materi Per Bab • Tahun Ajaran 2026/2027</p></div>
        <div class="kelas-grid">
          <button class="kelas-btn k1" onclick="pilihKelasKuis(1)"><span>🎈 Kelas 1</span><span class="kelas-sub">Fase A</span></button>
          <button class="kelas-btn k2" onclick="pilihKelasKuis(2)"><span>🚀 Kelas 2</span><span class="kelas-sub">Fase A</span></button>
          <button class="kelas-btn k3" onclick="pilihKelasKuis(3)"><span>🌟 Kelas 3</span><span class="kelas-sub">Fase B</span></button>
          <button class="kelas-btn k4" onclick="pilihKelasKuis(4)"><span>🧭 Kelas 4</span><span class="kelas-sub">Fase B</span></button>
          <button class="kelas-btn k5" onclick="pilihKelasKuis(5)"><span>⚡ Kelas 5</span><span class="kelas-sub">Fase C</span></button>
          <button class="kelas-btn k6" onclick="pilihKelasKuis(6)"><span>🏆 Kelas 6</span><span class="kelas-sub">Fase C</span></button>
        </div>`;
    }

    function pilihKelasKuis(kls) { mainkanEfek('klik'); kelasAktif = kls; tampilMenuMapel(); }

    function tampilMenuMapel() {
      const dataKelas = window.DATA_SEDDUR[kelasAktif];
      if (!dataKelas) { alert(`File materi kelas${kelasAktif}.js belum ditemukan di folder yang sama!`); return; }
      const kodeMapelTersedia = Object.keys(dataKelas);
      ucapkan(`Pilih mata pelajaran Kelas ${kelasAktif}!`);
      let tombolMapelHTML = kodeMapelTersedia.map(kode => {
        const info = daftarNamaMapel[kode];
        const jmlBab = dataKelas[kode].length;
        return `<button class="menu-btn ${info.kelasCss}" onclick="tampilMenuBab('${kode}')"><span>${info.ikon} ${info.judul}</span><span class="badge-jumlah">${jmlBab} Bab ▶️</span></button>`;
      }).join("");
      document.getElementById("app").innerHTML = `
        <div class="top-bar"><button class="bg-kembali" onclick="bukaMenuKelasKuis()">⬅️ Ganti Kelas</button><div class="star-bar">🎮 Kuis • Kelas ${kelasAktif}</div></div>
        <div class="card"><h2 style="color:#0284c7; font-size:1.22rem; margin-bottom:4px;">Mata Pelajaran Kelas ${kelasAktif}</h2><p style="color:#64748b; font-size:0.85rem;">Pilih mata pelajaran untuk melihat daftar Bab</p></div>
        ${tombolMapelHTML}`;
    }

    function tampilMenuBab(kodeMapel) {
      mainkanEfek('klik'); mapelAktif = kodeMapel;
      const daftarBab = window.DATA_SEDDUR[kelasAktif][kodeMapel];
      const infoMapel = daftarNamaMapel[kodeMapel];
      ucapkan(`Pilih Bab pada pelajaran ${infoMapel.judul}`);
      let tombolBabHTML = daftarBab.map((babObj, idx) => `

      const topik = document.getElementById("genTopik").value.trim() || "Materi Kurikulum Merdeka";
      const modeGbr = document.getElementById("genModeGambar").value;
      const jumlah = parseInt(document.getElementById("genJumlah").value, 10);

      let contohOpsi = `["Pilihan A", "Pilihan B", "Pilihan C", "Pilihan D"]`;
      if (modeGbr.includes("Jawaban Gambar")) {
        contohOpsi = `["🍎 Apel", "🍌 Pisang", "🍇 Anggur", "🍉 Semangka"]`;
      }

      const promptAI = `Buatkan ${jumlah} soal pilihan ganda Kurikulum Merdeka Tahun Ajaran 2026/2027 untuk siswa SD Kelas ${kls}.\n- Mata Pelajaran: ${mapel}\n- Kategori Ujian: ${katNama}\n- Topik Materi: ${topik}\n- Format Tampilan: ${modeGbr}\n\nATURAN WAJIB FORMAT OUTPUT:\nTuliskan HANYA dalam bentuk kode array JavaScript berikut tanpa teks pembuka/penutup agar bisa langsung saya copy-paste ke GitHub (file ujian${kls}.js bagian ${katKode}):\n\n${katKode}: [\n  {\n    ikon: "📝",\n    tanya: "Tulis pertanyaan jelas sesuai level siswa Kelas ${kls}...",\n    opsi: ${contohOpsi},\n    kunci: 0,\n    bahas: "Penjelasan singkat mengapa jawaban tersebut benar."\n  }\n]\nPastikan indeks "kunci" (0=A, 1=B, 2=C, 3=D) akurat dan gunakan emoji/ilustrasi visual yang menarik pada properti "ikon" maupun "opsi" sesuai mode gambar yang diminta.`;

      let daftarTemplate = [];
      for (let i = 1; i <= jumlah; i++) {
        daftarTemplate.push(`  {\n    ikon: "📝",\n    tanya: "Soal nomor ${i} (${mapel} - ${topik})...",\n    opsi: ${contohOpsi},\n    kunci: 0,\n    bahas: "Pembahasan soal nomor ${i}."\n  }`);
      }

      const kodeGitHub = `// Tempelkan kode ini ke dalam window.DATA_UJIAN[${kls}] pada file ujian${kls}.js\n${katKode}: [\n${daftarTemplate.join(",\n")}\n],`;

      document.getElementById("hasilPromptAI").value = promptAI;
      document.getElementById("hasilKodeSoal").value = kodeGitHub;
      mainkanEfek('benar');
    }

    function adminGeneratorBab() {
      document.getElementById("app").innerHTML = `
        <div class="top-bar"><button class="bg-kembali" onclick="tampilDashboardAdmin()">⬅️ Dashboard</button><div class="star-bar">📂 Generator Bab</div></div>
        <div class="card" style="text-align:left;">
          <h3 style="color:#0284c7; text-align:center;">Generator Daftar Bab (GitHub)</h3>
          <label class="label-form">Pilih Kelas:</label>
          <select id="babKelas" class="input-form"><option value="1">Kelas 1</option><option value="2">Kelas 2</option><option value="3">Kelas 3</option><option value="4">Kelas 4</option><option value="5">Kelas 5</option><option value="6">Kelas 6</option></select>
          <label class="label-form">Mata Pelajaran:</label>
          <select id="babMapel" class="input-form"><option value="pancasila">Pendidikan Pancasila</option><option value="bindo">Bahasa Indonesia</option><option value="mtk">Matematika</option><option value="ipas">IPAS</option><option value="bing">Bahasa Inggris</option></select>
          <label class="label-form">Semester:</label>
          <select id="babSemester" class="input-form"><option value="Semester 1">Semester 1</option><option value="Semester 2">Semester 2</option></select>
          <label class="label-form">Judul Bab:</label>
          <input type="text" id="babJudul" class="input-form" placeholder="Contoh: Bab 1 • Aku Cinta Pancasila" />
          <button class="btn-aksi" style="width:100%;" onclick="buatKodeBabGitHub()">⚡ Generate Struktur Bab GitHub</button>
          <label class="label-form" style="margin-top:12px;">Hasil Kode Struktur Bab (Tempel ke GitHub):</label>
          <textarea id="hasilKodeBab" class="textarea-kode" readonly></textarea>
          <button class="btn-aksi btn-sukses" style="width:100%;" onclick="salinTeks('hasilKodeBab')">📋 Salin Kode Bab</button>
        </div>`;
    }

    function buatKodeBabGitHub() {
      const kls = document.getElementById("babKelas").value;
      const mapel = document.getElementById("babMapel").value;
      const sem = document.getElementById("babSemester").value;
      const judul = document.getElementById("babJudul").value.replace(/"/g, '\\"') || "Bab Baru";
      document.getElementById("hasilKodeBab").value = `// Tambahkan ke dalam window.DATA_SEDDUR[${kls}].${mapel} di file kelas${kls}.js\n{\n  semester: "${sem}",\n  bab: "${judul}",\n  soal: [\n    {\n      ikon: "🌟",\n      tanya: "Contoh pertanyaan pertama untuk ${judul}?",\n      opsi: ["Jawaban A", "Jawaban B", "Jawaban C", "Jawaban D"],\n      kunci: 0,\n      bahas: "Pembahasan jawaban benar."\n    }\n  ]\n},`;
      mainkanEfek('benar');
    }

    function salinTeks(idEl) {
      const el = document.getElementById(idEl); el.select(); document.execCommand("copy");
      alert("✅ Kode berhasil disalin! Silakan paste ke file di GitHub Anda.");
    }

        function adminRekapNilai() {
      document.getElementById("app").innerHTML = `
        <div class="top-bar no-print"><button class="bg-kembali" onclick="tampilDashboardAdmin()">⬅️ Dashboard</button><div class="star-bar">📊 Rekap Nilai</div></div>
        <div class="card">
          <h2 style="color:#0284c7; font-size:1.18rem;">Rekap Nilai Ujian SDN Seddur 1</h2>
          <p style="font-size:0.8rem; color:#64748b;">Tahun Ajaran 2026/2027</p>
          <div class="no-print" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
            <select id="filterKelas" class="input-form" onchange="renderTabelNilai()">
              <option value="ALL">Semua Kelas</option><option value="1">Kelas 1</option><option value="2">Kelas 2</option><option value="3">Kelas 3</option><option value="4">Kelas 4</option><option value="5">Kelas 5</option><option value="6">Kelas 6</option>
            </select>
            <select id="filterKategori" class="input-form" onchange="renderTabelNilai()">
              <option value="ALL">Semua Kategori</option><option value="Latihan Bab">Latihan Bab</option><option value="UTS Semester 1">UTS Semester 1</option><option value="UAS Semester 1">UAS Semester 1</option><option value="UTS Semester 2">UTS Semester 2</option><option value="UAS Semester 2">UAS Semester 2</option>
            </select>
          </div>
          <div class="no-print" style="display:flex; gap:8px; justify-content:center; margin-top:6px;">
            <button class="btn-aksi" style="font-size:0.84rem; padding:10px 14px;" onclick="window.print()">🖨️ Cetak Hasil Filter</button>
            <button class="btn-aksi btn-bahaya" style="font-size:0.84rem; padding:10px 14px;" onclick="hapusDataHasilFilter()">🗑️ Hapus Data Filter</button>
          </div>
          <div id="wadahTabelNilai"></div>
        </div>`;
      renderTabelNilai();
    }

    function getDataTersaring() {
      const semua = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]");
      const fKelas = document.getElementById("filterKelas").value;
      const fKat = document.getElementById("filterKategori").value;
      return semua.filter(item => ((fKelas === "ALL") || (String(item.kelas) === fKelas)) && ((fKat === "ALL") || (item.kategori === fKat)));
    }

    function renderTabelNilai() {
      const data = getDataTersaring();
      const wadah = document.getElementById("wadahTabelNilai");
      if (data.length === 0) { wadah.innerHTML = `<p style="margin-top:14px; color:#64748b; font-size:0.88rem;">Belum ada data nilai untuk filter yang dipilih.</p>`; return; }
      let rows = data.map((d, i) => `<tr><td>${i + 1}</td><td><strong>${d.nama}</strong><br><span style="font-size:0.72rem; color:#64748b;">${d.tanggal}</span></td><td>Kls ${d.kelas}</td><td>${d.kategori}</td><td>${d.benar}</td><td><strong style="color:#0284c7;">${d.nilai}</strong></td></tr>`).join("");
      wadah.innerHTML = `<div class="table-wrap"><table><thead><tr><th>No</th><th>Nama Siswa</th><th>Kelas</th><th>Ujian</th><th>Benar</th><th>Nilai</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function hapusDataHasilFilter() {
      const tersaring = getDataTersaring();
      if (tersaring.length === 0) { alert("Tidak ada data pada filter ini untuk dihapus."); return; }
      if (!confirm(`Yakin ingin menghapus ${tersaring.length} data nilai yang tampil pada filter ini?`)) return;
      const semua = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]");
      const idDihapus = new Set(tersaring.map(item => item.id));
      localStorage.setItem("seddur_rekap_nilai", JSON.stringify(semua.filter(item => !idDihapus.has(item.id))));
      mainkanEfek('salah'); renderTabelNilai(); alert("✅ Data hasil filter berhasil dihapus!");
    }

    function adminUbahPassword() {
      document.getElementById("app").innerHTML = `
        <div class="top-bar"><button class="bg-kembali" onclick="tampilDashboardAdmin()">⬅️ Dashboard</button><div class="star-bar">🔑 Ubah Password</div></div>
        <div class="card">
          <h3 style="color:#0284c7;">Ubah Password Admin</h3>
          <p style="font-size:0.82rem; color:#64748b; margin-bottom:10px;">Gunakan password yang mudah diingat oleh guru/admin</p>
          <input type="password" id="passLama" class="input-nama" placeholder="Password Lama..." />
          <input type="password" id="passBaru" class="input-nama" placeholder="Password Baru..." />
          <input type="password" id="passKonfirm" class="input-nama" placeholder="Ulangi Password Baru..." />
          <button class="btn-aksi btn-sukses" style="width:100%; margin-top:10px;" onclick="simpanPasswordBaru()">💾 Simpan Password Baru</button>
        </div>`;
    }

    function simpanPasswordBaru() {
      const lama = document.getElementById("passLama").value;
      const baru = document.getElementById("passBaru").value.trim();
      const konfirm = document.getElementById("passKonfirm").value.trim();
      if (lama !== getPasswordAdmin()) { alert("Password lama tidak sesuai!"); return; }
      if (baru.length < 4) { alert("Password baru minimal 4 karakter!"); return; }
      if (baru !== konfirm) { alert("Konfirmasi password baru tidak cocok!"); return; }
      localStorage.setItem("seddur_admin_pass", baru);
      mainkanEfek('benar'); alert("✅ Password Admin berhasil diubah!"); tampilDashboardAdmin();
    }

    tampilBeranda();
  </script>
