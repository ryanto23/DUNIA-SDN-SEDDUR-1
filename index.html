      <script>
    let audioCtx = null;
    let audioCadangan = new Audio();
    audioCadangan.preload = "auto";
    function bukaKunciAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function mainkanEfek(jenis) {
      if (modeAplikasi === "ujian") return;
      bukaKunciAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (jenis === 'benar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc.start(now); osc.stop(now + 0.55);
      } else if (jenis === 'salah') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (jenis === 'klik') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(620, now);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    }

            function ucapkan(teks) {
      if (modeAplikasi === "ujian") return;
      bukaKunciAudio();
      if (!teks) return;
      try { audioCadangan.pause(); } catch (e) {}
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          const daftarSuara = window.speechSynthesis.getVoices();
          const suaraIndo = daftarSuara.find(v => v.lang.toLowerCase().includes('id') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Gadis'))) || daftarSuara.find(v => v.lang.toLowerCase().includes('id'));
          if (!isMobile || suaraIndo) {
            const u = new SpeechSynthesisUtterance(teks);
            u.lang = "id-ID";
            if (suaraIndo) u.voice = suaraIndo;
            u.rate = 0.97; u.pitch = 1.05; u.volume = 1.0;
            u.onerror = () => putarSuaraOnline(teks);
            window.speechSynthesis.speak(u);
            return;
          }
        } catch (err) {}
      }
      putarSuaraOnline(teks);
    }
    function putarSuaraOnline(teks) {
      try {
        const bersih = teks.replace(/[^\w\s.,?!-]/gi, '').slice(0, 180);
        audioCadangan.src = `https://google.com{encodeURIComponent(bersih)}`;
        audioCadangan.play().catch(() => {});
      } catch (e) {}
    }
    function acakArray(arr) {
      const salinan = [...arr];
      for (let i = salinan.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [salinan[i], salinan[j]] = [salinan[j], salinan[i]];
      }
      return salinan;
    }

            function getInfoMapel(kode) {
      if (daftarNamaMapel[kode]) return daftarNamaMapel[kode];
      if (window.MAPEL_KUSTOM && window.MAPEL_KUSTOM[kode]) return window.MAPEL_KUSTOM[kode];
      const judulRapi = String(kode).replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
      return { judul: judulRapi, ikon: "📘", kelasCss: "m-ipas" };
    }

    function getSemuaKodeMapelKelas(kls) {
      const setKode = new Set(Object.keys(daftarNamaMapel));
      Object.keys(window.MAPEL_KUSTOM || {}).forEach(k => setKode.add(k));
      const prefix = `${kls}-`;
      Object.keys(window.DATABASE_BAB || {}).forEach(k => {
        if (k.startsWith(prefix)) setKode.add(k.slice(prefix.length));
      });
      Object.keys(window.DATABASE_SOAL || {}).forEach(k => {
        if (k.startsWith(prefix)) {
          const sisa = k.slice(prefix.length);
          const idxStrip = sisa.indexOf("-");
          if (idxStrip > 0) setKode.add(sisa.slice(0, idxStrip));
        }
      });
      return Array.from(setKode);
    }

      const m = Math.floor(detik / 60);
      const s = detik % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function getFirebaseDB() {
      if (!window._fbDbReady && window.firebase) {
        if (!firebase.apps.length) {
          firebase.initializeApp({
            databaseURL: (window.FIREBASE_DB_URL || "https://firebasedatabase.app").replace(/\/$/, "")
          });
        }
        window._fbDbReady = firebase.database();
      }
      return window._fbDbReady;
    }

    function simpanRekapNilai(record) {
      try {
        const list = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]");
        list.push(record);
        localStorage.setItem("seddur_rekap_nilai", JSON.stringify(list));
      } catch (e) {}

      const db = getFirebaseDB();
      if (!db) {
        const infoEl = document.getElementById("statusSyncUjian");
        if (infoEl) infoEl.innerHTML = `<span style="color:#dc2626; font-weight:700;">⚠️ SDK Firebase belum termuat (cek koneksi internet).</span>`;
        return;
      }

      db.ref("rekap_nilai").push(record)
        .then(() => {
          const infoEl = document.getElementById("statusSyncUjian");
          if (infoEl) infoEl.innerHTML = `<span style="color:#15803d; font-weight:700;">✅ Nilai 100% terkirim &amp; tersinkron ke Cloud Firebase!</span>`;
        })
        .catch(err => {
          const infoEl = document.getElementById("statusSyncUjian");
          if (infoEl) infoEl.innerHTML = `<span style="color:#dc2626; font-weight:700;">⚠️ Ditolak Firebase: ${err.message}</span>`;
        });
    }

    function cariSoalDariDatabase(kls, kodeMapel, namaPaketAtauBab) {
      const dbSoal = window.DATABASE_SOAL || {};
      const infoMapel = getInfoMapel(kodeMapel);
      const namaMapel = infoMapel ? infoMapel.judul : kodeMapel;
      const kandidatKunci = [
        `${kls}-${kodeMapel}-${namaPaketAtauBab}`,
        `sd-Kelas ${kls}-${namaMapel}-${namaPaketAtauBab}`,
        `${kls}-${namaMapel}-${namaPaketAtauBab}`
      ];
      for (const k of kandidatKunci) {
        if (Array.isArray(dbSoal[k])) return dbSoal[k];
      }
      return [];
    }

    function getDaftarBabSinkron(kls, kodeMapel) {
      const dbBab = window.DATABASE_BAB || {};
      const infoMapel = getInfoMapel(kodeMapel);
      const namaMapel = infoMapel ? infoMapel.judul : kodeMapel;

      const listBabMentah = dbBab[`${kls}-${kodeMapel}`] || dbBab[`sd-Kelas ${kls}-${namaMapel}`] || [];
      const hasil = [];

      listBabMentah.forEach(judulBab => {
        const soalCocok = cariSoalDariDatabase(kls, kodeMapel, judulBab);
        hasil.push({
          bab: judulBab,
          soalUjian: soalCocok
        });
      });

      return hasil;
    }

    function tampilBabUjian(kodeMapel) {
      mapelAktif = kodeMapel;
      const infoMapel = getInfoMapel(kodeMapel);
      const daftarBab = getDaftarBabSinkron(kelasAktif, kodeMapel);

    function tampilMapelUTS_UAS(kodeKat, judulKat) {
      kodeKategoriUjianAktif = kodeKat;
      kategoriUjianAktif = judulKat;

            function mulaiUjianBabSpesifik(kodeMapel, idxBab) {
      const infoMapel = getInfoMapel(kodeMapel);
      const daftarBab = getDaftarBabSinkron(kelasAktif, kodeMapel);
      const targetBab = daftarBab[idxBab];

      if (!targetBab || !targetBab.soalUjian || targetBab.soalUjian.length === 0) {
        alert(`Belum ada soal ujian untuk "${targetBab ? targetBab.bab : 'Bab ini'}" pada file ujian${kelasAktif}.js!`);
        return;
      }

      if (!confirm(`Mulai Ujian Bab sekarang?\n• Peserta: ${namaSiswa} (${kodeUnikPeserta})\n• Mapel: ${infoMapel.judul}\n• Materi: ${targetBab.bab}\n• Jumlah Soal: ${targetBab.soalUjian.length} soal\n• Batas Waktu: 5 menit per soal`)) return;

      sedangModeTKA = false;
      modeAplikasi = "ujian";
      kodeKategoriUjianAktif = "latihan_bab";
      mapelUjianAktif = infoMapel.judul;
      kategoriUjianAktif = targetBab.bab;

      jalankanMesinCBT(targetBab.soalUjian);
    }

    function mulaiUjianUTS_UAS_Mapel(kodeMapel) {
      const infoMapel = getInfoMapel(kodeMapel);
      const daftarSoal = cariSoalDariDatabase(kelasAktif, kodeMapel, kodeKategoriUjianAktif);

      if (!daftarSoal || daftarSoal.length === 0) {
        alert(`Belum ada soal ${kategoriUjianAktif} untuk mata pelajaran ${infoMapel.judul} pada file ujian${kelasAktif}.js!`);
        return;
      }

      if (!confirm(`Mulai ${kategoriUjianAktif} sekarang?\n• Peserta: ${namaSiswa} (${kodeUnikPeserta})\n• Mapel: ${infoMapel.judul}\n• Jumlah Soal: ${daftarSoal.length} soal\n• Batas Waktu: 90 menit total`)) return;

      sedangModeTKA = false;
      modeAplikasi = "ujian";
      mapelUjianAktif = infoMapel.judul;

      jalankanMesinCBT(daftarSoal);
    }

    function jalankanMesinCBT(daftarSoalMentah) {
      document.body.classList.add("sedang-ujian");
      soalPermainan = acakArray(daftarSoalMentah).map(item => {
        const teksSoal = item.q || item.tanya || "";
        const daftarOpsi = item.p || item.opsi || [];
        const daftarOpsiSvg = item.pSvg || [];
        const idxKunciAsli = (typeof item.b === "number") ? item.b : (item.kunci || 0);

        const paketOpsi = daftarOpsi.map((teks, i) => ({
          teks: teks,
          svg: daftarOpsiSvg[i] || "",
          benar: i === idxKunciAsli
        }));
        const opsiAcak = acakArray(paketOpsi);

        return {
          ikon: item.ikon || "",
          svg: item.svg || "",
          tanya: teksSoal,
          opsi: opsiAcak.map(o => o.teks),
          opsiSvg: opsiAcak.map(o => o.svg),
          kunci: opsiAcak.findIndex(o => o.benar)
        };
      });

      jawabanSiswaUjian = new Array(soalPermainan.length).fill(null);
      indeksSoal = 0;

      hentikanTimer();
      if (kodeKategoriUjianAktif === "latihan_bab") {
        mulaiTimerPerSoalBab();
      } else {
        sisaDetik = 90 * 60;
        timerInterval = setInterval(() => {
          sisaDetik--;
          const elTimer = document.getElementById("tampilanTimer");
          if (elTimer) elTimer.textContent = formatWaktu(sisaDetik);
          if (sisaDetik <= 0) {
            hentikanTimer();
            alert("⏰ Waktu 90 menit telah habis! Jawaban Anda otomatis dikumpulkan.");
            selesaiDanKumpulkanUjian(true);
          }
        }, 1000);
      }

      renderSoalUjianCBT();
    }

    function mulaiTimerPerSoalBab() {
      hentikanTimer();
      sisaDetik = 5 * 60;
      timerInterval = setInterval(() => {
        sisaDetik--;
        const elTimer = document.getElementById("tampilanTimer");
        if (elTimer) elTimer.textContent = formatWaktu(sisaDetik);
        if (sisaDetik <= 0) {
          hentikanTimer();
          if (indeksSoal < soalPermainan.length - 1) {
            indeksSoal++;
            mulaiTimerPerSoalBab();
            renderSoalUjianCBT();
          } else {
            alert("⏰ Waktu soal terakhir telah habis! Ujian selesai.");
            selesaiDanKumpulkanUjian(true);
          }
        }
      }, 1000);
    }

            function renderSoalUjianCBT() {
      const s = soalPermainan[indeksSoal];
      const hurufOpsi = ["A", "B", "C", "D"];
      const isBab = kodeKategoriUjianAktif === "latihan_bab";

      let navNomorHTML = soalPermainan.map((_, idx) => {
        const clsAktif = idx === indeksSoal ? "aktif" : "";
        const clsTerjawab = jawabanSiswaUjian[idx] !== null ? "terjawab" : "";
        const onclickAttr = isBab ? "" : `onclick="pindahNomorUjian(${idx})"`;
        const styleLocked = isBab && idx !== indeksSoal ? "opacity:0.55; cursor:not-allowed;" : "";
        return `<button class="nav-nomor-btn ${clsAktif} ${clsTerjawab}" ${onclickAttr} style="${styleLocked}">${idx + 1}</button>`;
      }).join("");

      let opsiHTML = s.opsi.map((teks, idx) => {
        const terpilih = jawabanSiswaUjian[indeksSoal] === idx ? "cbt-opsi-terpilih" : "";
        const svgOpsi = (s.opsiSvg && s.opsiSvg[idx]) ? `<span class="svg-opsi-wrap">${s.opsiSvg[idx]}</span>` : "";
        return `
          <button class="cbt-opsi-item ${terpilih}" onclick="pilihJawabanUjian(${idx})">
            <span class="cbt-huruf">${hurufOpsi[idx]}</span>
            ${svgOpsi}
            <span>${teks}</span>
          </button>`;
      }).join("");

      const tombolSebelumnya = (!isBab && indeksSoal > 0)
        ? `<button class="bg-kembali" onclick="pindahNomorUjian(${indeksSoal - 1})">⬅️ Sebelumnya</button>`
        : `<div></div>`;

      const tombolBerikutnya = (indeksSoal < soalPermainan.length - 1)
        ? `<button class="btn-aksi" style="margin:0; background:#2563eb; box-shadow:none;" onclick="lanjutNomorUjian()">Soal Berikutnya ➡️</button>`
        : `<button class="btn-aksi btn-sukses" style="margin:0; box-shadow:none;" onclick="selesaiDanKumpulkanUjian(false)">✅ Selesai & Kumpulkan</button>`;

      const subHeaderInfo = sedangModeTKA
        ? `Simulasi Tes TKA • SDN Seddur 1`
        : `${namaSiswa} • Kode: ${kodeUnikPeserta} (Kls ${kelasAktif})`;

      document.getElementById("app").innerHTML = `
        <div class="cbt-header-info">
          <div>
            <div style="font-weight:700;">${mapelUjianAktif} • ${kategoriUjianAktif}</div>
            <div style="font-size:0.75rem; opacity:0.85;">${subHeaderInfo}</div>
          </div>
          <div class="timer-box" id="tampilanTimer">${formatWaktu(sisaDetik)}</div>
        </div>

        <div class="nav-nomor-grid">${navNomorHTML}</div>

        <div class="card card-cbt">
          <div style="display:flex; justify-content:space-between; font-size:0.84rem; font-weight:700; color:#475569;">
            <span>SOAL NOMOR ${indeksSoal + 1} DARI ${soalPermainan.length}</span>
            <span>${jawabanSiswaUjian[indeksSoal] !== null ? '✅ Terjawab' : '⬜ Belum dijawab'}</span>
          </div>

          <div class="cbt-soal-teks">
            ${s.ikon ? `<div style="font-size:2rem; margin-bottom:6px;">${s.ikon}</div>` : ''}
            ${s.svg ? `<div class="svg-soal-wrap">${s.svg}</div>` : ''}
            <div>${s.tanya}</div>
          </div>

          <div class="cbt-opsi-list">${opsiHTML}</div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:12px; border-top:1px solid #e2e8f0;">
            ${tombolSebelumnya}
            ${tombolBerikutnya}
          </div>
        </div>`;
    }

    function pilihJawabanUjian(idxOpsi) {
      jawabanSiswaUjian[indeksSoal] = idxOpsi;
      renderSoalUjianCBT();
    }

    function pindahNomorUjian(idxTujuan) {
      if (kodeKategoriUjianAktif === "latihan_bab") return;
      indeksSoal = idxTujuan;
      renderSoalUjianCBT();
    }

    function lanjutNomorUjian() {
      if (kodeKategoriUjianAktif === "latihan_bab") {
        if (jawabanSiswaUjian[indeksSoal] === null) {
          if (!confirm("Soal ini belum dijawab dan tidak bisa kembali ke nomor sebelumnya. Lanjut ke soal berikutnya?")) return;
        }
        indeksSoal++;
        mulaiTimerPerSoalBab();
      } else {
        indeksSoal++;
      }
      renderSoalUjianCBT();
    }

    function selesaiDanKumpulkanUjian(otomatis) {
      const belumDijawab = jawabanSiswaUjian.filter(j => j === null).length;
      if (!otomatis) {
        const pesanKonfirm = belumDijawab > 0
          ? `Masih ada ${belumDijawab} soal yang belum dijawab.\nYakin ingin mengumpulkan sekarang?`
          : `Semua soal sudah dijawab.\nKumpulkan hasil sekarang?`;
        if (!confirm(pesanKonfirm)) return;
      }

      hentikanTimer();
      document.body.classList.remove("sedang-ujian");
      jumlahBenar = 0;
      soalPermainan.forEach((soal, idx) => {
        if (jawabanSiswaUjian[idx] === soal.kunci) jumlahBenar++;
      });

      const totalSoal = soalPermainan.length;
      const nilaiAkhir = Math.round((jumlahBenar / totalSoal) * 100);

      if (sedangModeTKA) {
        document.getElementById("app").innerHTML = `
          <div class="card card-cbt" style="text-align:center;">
            <div style="font-size:2.6rem;">🎯</div>
            <h2 style="color:#0f172a; font-size:1.3rem; margin:6px 0;">Hasil Simulasi Tes TKA</h2>

            <div style="background:#f8fafc; border-radius:12px; padding:14px; border:1px solid #cbd5e1; font-size:0.92rem; color:#1e293b; text-align:left; line-height:1.7;">
              <div><strong>Sekolah:</strong> SDN Seddur 1</div>

              <div><strong>Sesi Latihan:</strong> ${kategoriUjianAktif}</div>
              <div><strong>Jumlah Benar:</strong> ${jumlahBenar} dari ${totalSoal} Soal</div>
              <div style="font-size:1.35rem; font-weight:700; color:#059669; margin-top:8px; padding-top:8px; border-top:1px dashed #cbd5e1; text-align:center;">
                NILAI SIMULASI TKA: ${nilaiAkhir}
              </div>
            </div>

            <button class="btn-aksi btn-sukses" style="width:100%; margin-top:14px; box-shadow:none;" onclick="tampilMenuMapelTKA()">🔄 Pilih Sesi / Mapel TKA Lain</button>
            <button class="btn-aksi" style="width:100%; margin-top:8px; background:#0f172a; box-shadow:none;" onclick="tampilBeranda()">🏠 Kembali ke Home</button>
          </div>`;
        sedangModeTKA = false;
        return;
      }

      const tipeUjianSimpan = (kodeKategoriUjianAktif === "latihan_bab") ? "BAB" : "UTS_UAS";
      simpanRekapNilai({
        id: Date.now(),
        tanggal: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        nama: namaSiswa,
        kodeUnik: kodeUnikPeserta,
        kelas: String(kelasAktif),
        mapel: mapelUjianAktif,
        tipeUjian: tipeUjianSimpan,
        kategori: kategoriUjianAktif,
        benar: `${jumlahBenar}/${totalSoal}`,
        nilai: nilaiAkhir
      });

      document.getElementById("app").innerHTML = `
        <div class="card card-cbt" style="text-align:center;">
          <div style="font-size:2.6rem;">📋</div>
          <h2 style="color:#0f172a; font-size:1.3rem; margin:6px 0;">Ujian Telah Dikumpulkan</h2>
          <p id="statusSyncUjian" style="color:#0284c7; font-size:0.86rem; margin-bottom:14px;">⏳ Mengirim nilai ke Cloud Firebase...</p>

          <div style="background:#f8fafc; border-radius:12px; padding:14px; border:1px solid #cbd5e1; font-size:0.92rem; color:#1e293b; text-align:left; line-height:1.7;">
            <div><strong>Sekolah:</strong> SDN Seddur 1</div>
            <div><strong>Nama Peserta:</strong> ${namaSiswa}</div>
            <div><strong>Kode Unik / Sesi:</strong> <span style="background:#dcfce7; color:#15803d; padding:2px 8px; border-radius:6px; font-weight:700;">${kodeUnikPeserta}</span></div>

            <div><strong>Mata Pelajaran:</strong> ${mapelUjianAktif}</div>
            <div><strong>Jenis / Materi Ujian:</strong> ${kategoriUjianAktif}</div>
            <div><strong>Jumlah Benar:</strong> ${jumlahBenar} dari ${totalSoal} Soal</div>
            <div style="font-size:1.3rem; font-weight:700; color:#2563eb; margin-top:8px; padding-top:8px; border-top:1px dashed #cbd5e1; text-align:center;">
              NILAI UJIAN: ${nilaiAkhir}
            </div>
          </div>

          <button class="btn-aksi" style="width:100%; margin-top:14px; background:#0f172a; box-shadow:none;" onclick="tampilBeranda()">🏠 Kembali ke Home</button>
        </div>`;
    }

            function tampilPertanyaanKuis() {
      if (indeksSoal >= soalPermainan.length) { tampilSertifikatKuis(); return; }
      sudahMenjawab = false;
      const s = soalPermainan[indeksSoal];
      const persen = Math.round((indeksSoal / soalPermainan.length) * 100);
      const babObj = window.DATA_SEDDUR[kelasAktif][mapelAktif][babAktif];
      if (kelasAktif <= 3) ucapkan(s.tanya);
      let opsiHTML = s.opsi.map((teks, idx) => `<button class="opsi-btn" id="pilihan-${idx}" onclick="periksaJawabanKuis(${idx})">${teks}</button>`).join("");
      document.getElementById("app").innerHTML = `
        <div class="top-bar"><button class="bg-kembali" onclick="tampilMenuBab('${mapelAktif}')">⬅️ Bab</button><div class="star-bar">⭐ ${skorTotal} | ${indeksSoal + 1}/${soalPermainan.length}</div></div>

          ${comboBenar >= 2 ? `<div class="combo-badge">🔥 Combo Benar ${comboBenar}x! (+Bonus)</div>` : ''}
          <div class="visual-box"><span class="visual-ikon anim-bounce">${s.ikon}</span>${s.tanya}</div>
          <button class="btn-suara" onclick="ucapkan('${s.tanya.replace(/'/g, "")}')">🔊 Dengarkan Soal</button>
          <div class="opsi-grid">${opsiHTML}</div>
          <div id="areaPembahasan"></div>
        </div>`;
    }

    function periksaJawabanKuis(pilihan) {
      if (sudahMenjawab) return;
      sudahMenjawab = true;
      const s = soalPermainan[indeksSoal];
      const btnPilih = document.getElementById("pilihan-" + pilihan);
      const btnBenar = document.getElementById("pilihan-" + s.kunci);
      if (pilihan === s.kunci) {
        btnPilih.classList.add("benar"); jumlahBenar++; comboBenar++;
        const bonus = comboBenar >= 3 ? 20 : (comboBenar === 2 ? 10 : 0);
        skorTotal += (100 + bonus); mainkanEfek('benar'); ucapkan(`Hebat! Jawabanmu benar!`);
        setTimeout(() => { indeksSoal++; tampilPertanyaanKuis(); }, 1250);
      } else {
        btnPilih.classList.add("salah"); btnBenar.classList.add("benar"); comboBenar = 0; mainkanEfek('salah');
        ucapkan("Kurang tepat, yuk baca pembahasannya!");
        document.getElementById("areaPembahasan").innerHTML = `<div class="info-bahas">💡 <strong>Pembahasan:</strong> ${s.bahas}</div><button class="btn-aksi" onclick="lanjutSoalKuis()">Soal Berikutnya ➡️</button>`;
      }
    }

    function lanjutSoalKuis() { mainkanEfek('klik'); indeksSoal++; tampilPertanyaanKuis(); }

      mainkanEfek('benar');
      const totalSoal = soalPermainan.length;
      const nilaiAkhir = Math.round((jumlahBenar / totalSoal) * 100);

      else if (nilaiAkhir >= 65) { gelar = "Jagoan Hebat SDN Seddur 1"; ikonGelar = "🌟🎖️"; ucapanSkor = `Mantap sekali! Nilai kamu ${nilaiAkhir}. Sedikit lagi menuju nilai sempurna!`; }

      document.getElementById("app").innerHTML = `
        <div class="card">
          <div class="sertifikat">

            <div style="font-size:0.82rem; font-weight:700; color:#b45309; letter-spacing:1px; margin-top:4px;">SERTIFIKAT KUIS BELAJAR (TA 2026/2027)</div>
            <h2 style="color:#0284c7; font-size:1.35rem; margin:6px 0;">${namaSiswa}</h2>
            <p style="font-size:0.95rem; font-weight:700; color:#15803d; margin-bottom:8px;">🏅 ${gelar}</p>

            function muatRekapDariCloud() {
      const infoBox = document.getElementById("infoRingkasanFilter");
      const db = getFirebaseDB();
      if (!db) {
        try { cacheRekapCloud = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]"); } catch (e) { cacheRekapCloud = []; }
        perbaruiOpsiKodeUnikRekap();
        renderTabelNilai();
        return;
      }
      if (infoBox) infoBox.textContent = "⏳ Sedang menarik nilai terbaru dari Firebase Cloud...";

      db.ref("rekap_nilai").once("value")
        .then(snapshot => {
          const objData = snapshot.val();
          const hasil = [];
          if (objData && typeof objData === "object") {
            Object.keys(objData).forEach(fbKey => {
              const item = objData[fbKey];
              if (item && item.nama) {
                item._fbKey = fbKey;
                hasil.push(item);
              }
            });
          }
          cacheRekapCloud = hasil;
          try { localStorage.setItem("seddur_rekap_nilai", JSON.stringify(hasil)); } catch (e) {}
          perbaruiOpsiKodeUnikRekap();
          perbaruiOpsiBabRekap();
          renderTabelNilai();
        })
        .catch(err => {
          alert("⚠️ Gagal membaca Firebase: " + err.message);
          try { cacheRekapCloud = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]"); } catch (e) { cacheRekapCloud = []; }
          perbaruiOpsiKodeUnikRekap();
          renderTabelNilai();
        });
    }

    function perbaruiOpsiBabRekap() {

        if (!isUTS_UAS && cocokKls && cocokMpl) {

            function getDataTersaring() {
      let semua = cacheRekapCloud.length ? cacheRekapCloud : [];
      if (!semua.length) {
        try { semua = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]"); } catch (e) {}
      }
      const fKelas = String(document.getElementById("filterKelas").value);
      const mapelSplit = document.getElementById("filterMapel").value.split("|");
      const fMapelKode = mapelSplit[0] || "ALL";
      const fMapelNama = mapelSplit[1] || "";
      const fTipe = document.getElementById("filterTipeUjian").value;
      const fBab = document.getElementById("filterBabSpesifik") ? document.getElementById("filterBabSpesifik").value : "__ALL_BAB__";
      const fUnik = document.getElementById("filterKodeUnik").value;

      return semua.filter(item => {
        const cocokKelas = (fKelas === "ALL") || (String(item.kelas) === fKelas);
        const itemMapelLow = (item.mapel || "").trim().toLowerCase();
        const filterMapelLow = fMapelNama.trim().toLowerCase();
        const cocokMapel = (fMapelKode === "ALL") || (itemMapelLow === filterMapelLow) || itemMapelLow.includes(filterMapelLow);
        const unikItem = (item.kodeUnik || "-").toUpperCase();
        const cocokUnik = (fUnik === "ALL") || (unikItem === fUnik);

        const katLow = (item.kategori || "").trim().toLowerCase();
        const isUTS_UAS = ["uts semester 1", "uas semester 1", "uts semester 2", "uas semester 2"].includes(katLow);

        let cocokUjian = false;
        if (fTipe === "ALL") {
          cocokUjian = true;
        } else if (fTipe === "UAS_ALL") {
          cocokUjian = katLow.includes("uas");
        } else if (fTipe === "UTS_ALL") {
          cocokUjian = katLow.includes("uts");
        } else if (fTipe === "BAB") {
          cocokUjian = (fBab === "__ALL_BAB__") ? !isUTS_UAS : (katLow === fBab.trim().toLowerCase());
        } else {
          cocokUjian = katLow === fTipe.trim().toLowerCase();
        }

        return cocokKelas && cocokMapel && cocokUjian && cocokUnik;
      });
    }

    function downloadExcelTerfilter() {
      const data = getDataTersaring();
      if (data.length === 0) { alert("Tidak ada data pada filter yang dipilih untuk diunduh!"); return; }

      const fKelas = document.getElementById("filterKelas").value;
      const fMapelNama = document.getElementById("filterMapel").value.split("|").pop() || "Mapel";
      const fTipe = document.getElementById("filterTipeUjian").value;
      const fBab = document.getElementById("filterBabSpesifik") ? document.getElementById("filterBabSpesifik").value : "";
      const fUnik = document.getElementById("filterKodeUnik").value;

      let csvContent = "No,Tanggal,Nama Siswa,Kode Unik,Kelas,Mata Pelajaran,Materi / Jenis Ujian,Jawaban Benar,Nilai Akhir\n";
      data.forEach((d, idx) => {
        const namaAman = `"${String(d.nama).replace(/"/g, '""')}"`;
        const unikAman = `"${String(d.kodeUnik || '-').replace(/"/g, '""')}"`;
        const tglAman = `"${String(d.tanggal).replace(/"/g, '""')}"`;
        const mapelAman = `"${String(d.mapel || 'Umum').replace(/"/g, '""')}"`;
        const katAman = `"${String(d.kategori).replace(/"/g, '""')}"`;
        const benarAman = `"${String(d.benar)}"`;
        csvContent += `${idx + 1},${tglAman},${namaAman},${unikAman},Kelas ${d.kelas},${mapelAman},${katAman},${benarAman},${d.nilai}\n`;
      });

      const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const labelKelas = fKelas === "ALL" ? "SemuaKelas" : `Kelas${fKelas}`;
      const labelMapel = fMapelNama.replace(/[^a-zA-Z0-9]/g, "_");
      const labelMateri = (fTipe === "BAB" ? fBab : fTipe).slice(0, 25).replace(/[^a-zA-Z0-9]/g, "_");
      const labelUnik = fUnik === "ALL" ? "SemuaKode" : fUnik.replace(/[^a-zA-Z0-9]/g, "_");

      link.setAttribute("href", url);
      link.setAttribute("download", `Rekap_${labelKelas}_${labelMapel}_${labelMateri}_${labelUnik}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    async function hapusDataHasilFilter() {
      const tersaring = getDataTersaring();
      if (tersaring.length === 0) { alert("Tidak ada data pada filter ini untuk dihapus."); return; }
      if (!confirm(`Yakin ingin menghapus ${tersaring.length} data nilai yang tampil pada filter ini dari Firebase Cloud & semua perangkat?`)) return;

      const db = getFirebaseDB();
      if (db) {
        for (const item of tersaring) {
          if (item._fbKey) {
            try { await db.ref(`rekap_nilai/${item._fbKey}`).remove(); } catch (e) {}
          }
        }
      }

      let semua = [];
      try { semua = JSON.parse(localStorage.getItem("seddur_rekap_nilai") || "[]"); } catch (e) {}
      const idDihapus = new Set(tersaring.map(item => item.id));
      try { localStorage.setItem("seddur_rekap_nilai", JSON.stringify(semua.filter(item => !idDihapus.has(item.id)))); } catch (e) {}
      cacheRekapCloud = cacheRekapCloud.filter(item => !idDihapus.has(item.id));

      mainkanEfek('salah');
      perbaruiOpsiKodeUnikRekap();
      renderTabelNilai();
      alert("✅ Data hasil filter berhasil dihapus dari semua perangkat!");
    }

    tampilBeranda();
  </script>
</body>
</html>
