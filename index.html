<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DUNIA SDN SEDDUR 1 - Kurikulum Merdeka 2026/2027</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; background: linear-gradient(180deg, #bae6fd 0%, #fef08a 55%, #fed7aa 100%); min-height: 100dvh; color: #1e293b; }
    body { padding-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
    header { width: 100%; background: linear-gradient(90deg, #0284c7, #0ea5e9); padding: 12px 14px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border-bottom: 4px solid #facc15; position: sticky; top: 0; z-index: 20; color: #fff; }
    header h1 { font-size: 1.22rem; letter-spacing: 0.5px; text-shadow: 1px 2px 0 rgba(0,0,0,0.2); }
    header p { font-size: 0.76rem; opacity: 0.95; margin-top: 2px; }
    .container { width: 100%; max-width: 560px; margin: 12px auto; padding: 0 12px; }
    .card { width: 100%; background: #ffffff; border-radius: 22px; padding: 16px 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 3px solid #e2e8f0; margin-bottom: 12px; text-align: center; animation: popIn 0.25s ease; }
    @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .anim-bounce { display: inline-block; animation: bounce 1.8s infinite; }
    .input-nama { width: 100%; padding: 12px 14px; border-radius: 16px; border: 3px solid #7dd3fc; font-size: 1.05rem; font-weight: 600; text-align: center; color: #0f172a; outline: none; margin: 10px 0 6px; background: #f0f9ff; user-select: text; }
    .input-nama:focus { border-color: #0284c7; background: #ffffff; }
    .kelas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .kelas-btn { border: none; border-radius: 18px; padding: 16px 10px; color: #fff; font-size: 1.12rem; font-weight: 700; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.18); touch-action: manipulation; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .kelas-btn:active { transform: translateY(3px); box-shadow: none; }
    .kelas-sub { font-size: 0.74rem; font-weight: 600; background: rgba(255,255,255,0.25); padding: 2px 8px; border-radius: 8px; }
    .k1 { background: linear-gradient(135deg, #f43f5e, #fb7185); }
    .k2 { background: linear-gradient(135deg, #f97316, #fb923c); }
    .k3 { background: linear-gradient(135deg, #eab308, #facc15); color: #713f12; }
    .k4 { background: linear-gradient(135deg, #10b981, #34d399); }
    .k5 { background: linear-gradient(135deg, #0ea5e9, #38bdf8); }
    .k6 { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }

        .menu-btn { width: 100%; border: none; border-radius: 18px; padding: 14px 15px; margin-bottom: 10px; color: #fff; font-size: 1.02rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; box-shadow: 0 5px 0 rgba(0,0,0,0.18); touch-action: manipulation; text-align: left; }
    .menu-btn:active { transform: translateY(3px); box-shadow: none; }
    .badge-jumlah { background: rgba(255,255,255,0.28); padding: 4px 10px; border-radius: 10px; font-size: 0.76rem; white-space: nowrap; flex-shrink: 0; }
    .m-pancasila { background: linear-gradient(135deg, #e11d48, #fb7185); }
    .m-bindo { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .m-mtk { background: linear-gradient(135deg, #059669, #34d399); }
    .m-ipas { background: linear-gradient(135deg, #0284c7, #38bdf8); }
    .m-bing { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
    .bab-btn { background: #ffffff; color: #1e293b; border: 3px solid #7dd3fc; box-shadow: 0 4px 0 #7dd3fc; }
    .bab-badge { background: #e0f2fe; color: #0369a1; padding: 4px 9px; border-radius: 10px; font-size: 0.76rem; white-space: nowrap; flex-shrink: 0; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 10px; }
    .bg-kembali { background: #ffffff; color: #475569; border: 2px solid #cbd5e1; padding: 7px 12px; border-radius: 14px; font-size: 0.86rem; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 #cbd5e1; touch-action: manipulation; }
    .bg-kembali:active { transform: translateY(2px); box-shadow: none; }
    .progress-wrap { background: #e2e8f0; height: 9px; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
    .progress-fill { background: linear-gradient(90deg, #38bdf8, #22c55e); height: 100%; width: 0%; transition: width 0.3s ease; }
    .btn-suara { background: #fef08a; color: #854d0e; border: 2px solid #facc15; padding: 8px 15px; border-radius: 50px; font-size: 0.88rem; font-weight: 700; cursor: pointer; margin: 6px 0 10px; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 3px 0 #eab308; touch-action: manipulation; }
    .visual-box { width: 100%; background: #f8fafc; border: 2px dashed #7dd3fc; border-radius: 18px; padding: 14px 10px; margin: 6px 0 12px; font-size: 1.2rem; font-weight: 700; line-height: 1.45; color: #0f172a; }
    .visual-ikon { font-size: 2.5rem; display: block; margin-bottom: 6px; }
    .opsi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 8px; width: 100%; }
    .opsi-btn { width: 100%; background: #ffffff; border: 3px solid #cbd5e1; border-radius: 16px; padding: 12px 8px; font-size: 1rem; font-weight: 700; color: #1e293b; cursor: pointer; box-shadow: 0 4px 0 #cbd5e1; touch-action: manipulation; min-height: 56px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.25; }
    .opsi-btn:active { transform: translateY(3px); box-shadow: none; }
    .benar { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; box-shadow: 0 4px 0 #22c55e !important; }
    .salah { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; box-shadow: 0 4px 0 #ef4444 !important; }
    .star-bar { font-size: 0.85rem; font-weight: 700; color: #d97706; background: #fef3c7; padding: 6px 10px; border-radius: 12px; border: 2px solid #fde68a; white-space: nowrap; }
    .combo-badge { display: inline-block; background: #ffedd5; color: #c2410c; border: 2px solid #fdba74; padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; }
    .info-bahas { background: #eff6ff; border: 2px solid #93c5fd; color: #1e40af; border-radius: 14px; padding: 10px; margin-top: 10px; font-size: 0.88rem; font-weight: 600; text-align: left; }
    .sertifikat { background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 4px solid #f59e0b; border-radius: 22px; padding: 18px 14px; margin: 10px 0; }
    .btn-aksi { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: #fff; border: none; padding: 13px 22px; border-radius: 16px; font-size: 1.02rem; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #0369a1; touch-action: manipulation; }
    @media (min-width: 600px) {
      header h1 { font-size: 1.48rem; }
      .kelas-grid { grid-template-columns: 1fr 1fr 1fr; }
      .opsi-btn { font-size: 1.12rem; min-height: 62px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏫 DUNIA SDN SEDDUR 1</h1>
    <p>Kurikulum Merdeka • Tahun Ajaran 2026/2027</p>
  </header>
  <div class="container" id="app"></div>

  <script>window.DATA_SEDDUR = {};</script>
  <script src="kelas1.js"></script>
  <script src="kelas2.js"></script>
  <script src="kelas3.js"></script>
  <script src="kelas4.js"></script>
  <script src="kelas5.js"></script>
  <script src="kelas6.js"></script>
  <script>

        let audioCtx = null;
    let audioCadangan = new Audio();
    audioCadangan.preload = "auto";

    function bukaKunciAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function mainkanEfek(jenis) {
      bukaKunciAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (jenis === 'benar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc.start(now); osc.stop(now + 0.55);
      } else if (jenis === 'salah') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (jenis === 'klik') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(620, now);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    }

    function ucapkan(teks) {
      bukaKunciAudio();
      if (!teks) return;
      try { audioCadangan.pause(); } catch (e) {}
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          const daftarSuara = window.speechSynthesis.getVoices();
          const suaraIndo =
            daftarSuara.find(v => v.lang.toLowerCase().includes('id') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Gadis'))) ||
            daftarSuara.find(v => v.lang.toLowerCase().includes('id'));
          if (!isMobile || suaraIndo) {
            const u = new SpeechSynthesisUtterance(teks);
            u.lang = "id-ID";
            if (suaraIndo) u.voice = suaraIndo;
            u.rate = 0.97; u.pitch = 1.05; u.volume = 1.0;
            u.onerror = () => putarSuaraOnline(teks);
            window.speechSynthesis.speak(u);
            return;
          }
        } catch (err) {}
      }
      putarSuaraOnline(teks);
    }

    function putarSuaraOnline(teks) {
      try {
        const bersih = teks.replace(/[^\w\s.,?!-]/gi, '').slice(0, 180);
        audioCadangan.src = `https://googleapis.com{encodeURIComponent(bersih)}`;
        audioCadangan.play().catch(() => {});
      } catch (e) {}
    }

    function acakArray(arr) {
      const salinan = [...arr];
      for (let i = salinan.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [salinan[i], salinan[j]] = [salinan[j], salinan[i]];
      }
      return salinan;
    }

    let namaSiswa = "Siswa Hebat";
    let kelasAktif = 1;
    let mapelAktif = "";
    let babAktif = 0;
    let soalPermainan = [];
    let indeksSoal = 0;
    let skorTotal = 0;
    let jumlahBenar = 0;
    let comboBenar = 0;
    let sudahMenjawab = false;

    const daftarNamaMapel = {
      pancasila: { judul: "Pendidikan Pancasila", ikon: "🦅", kelasCss: "m-pancasila" },
      bindo: { judul: "Bahasa Indonesia", ikon: "📚", kelasCss: "m-bindo" },
      mtk: { judul: "Matematika", ikon: "🔢", kelasCss: "m-mtk" },
      ipas: { judul: "IPAS (Alam & Sosial)", ikon: "🌍", kelasCss: "m-ipas" },
      bing: { judul: "Bahasa Inggris", ikon: "🔤", kelasCss: "m-bing" }
    };

    function simpanNamaDanPilihKelas(kls) {
      const inputEl = document.getElementById("inputNamaSiswa");
      if (inputEl && inputEl.value.trim() !== "") namaSiswa = inputEl.value.trim();
      mainkanEfek('klik');
      kelasAktif = kls;
      tampilMenuMapel();
    }

    function tampilBeranda() {
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
      document.getElementById("app").innerHTML = `
        <div class="card">
          <div style="font-size:2.8rem; margin-bottom:4px;" class="anim-bounce">🏫🎓🌟</div>
          <h2 style="color:#0284c7; font-size:1.22rem;">Selamat Datang di Dunia SDN Seddur 1!</h2>
          <p style="color:#64748b; font-size:0.86rem; margin-top:2px;">Materi Per Bab • Tahun Ajaran 2026/2027</p>
          <input type="text" id="inputNamaSiswa" class="input-nama" placeholder="Ketik Nama Siswa di sini..." value="${namaSiswa === 'Siswa Hebat' ? '' : namaSiswa}" maxlength="25" />
        </div>
        <div class="kelas-grid">
          <button class="kelas-btn k1" onclick="simpanNamaDanPilihKelas(1)"><span>🎈 Kelas 1</span><span class="kelas-sub">Fase A</span></button>
          <button class="kelas-btn k2" onclick="simpanNamaDanPilihKelas(2)"><span>🚀 Kelas 2</span><span class="kelas-sub">Fase A</span></button>
          <button class="kelas-btn k3" onclick="simpanNamaDanPilihKelas(3)"><span>🌟 Kelas 3</span><span class="kelas-sub">Fase B</span></button>
          <button class="kelas-btn k4" onclick="simpanNamaDanPilihKelas(4)"><span>🧭 Kelas 4</span><span class="kelas-sub">Fase B</span></button>
          <button class="kelas-btn k5" onclick="simpanNamaDanPilihKelas(5)"><span>⚡ Kelas 5</span><span class="kelas-sub">Fase C</span></button>
          <button class="kelas-btn k6" onclick="simpanNamaDanPilihKelas(6)"><span>🏆 Kelas 6</span><span class="kelas-sub">Fase C</span></button>
        </div>`;
    }

    function tampilMenuMapel() {
      const dataKelas = window.DATA_SEDDUR[kelasAktif];
      if (!dataKelas) {
        alert(`File materi kelas${kelasAktif}.js belum ditemukan di folder yang sama!`);
        return;
      }
      const kodeMapelTersedia = Object.keys(dataKelas);
      ucapkan(`Halo ${namaSiswa}, pilih mata pelajaran Kelas ${kelasAktif}!`);

      let tombolMapelHTML = kodeMapelTersedia.map(kode => {
        const info = daftarNamaMapel[kode];
        const jmlBab = dataKelas[kode].length;
        return `
          <button class="menu-btn ${info.kelasCss}" onclick="tampilMenuBab('${kode}')">
            <span>${info.ikon} ${info.judul}</span>
            <span class="badge-jumlah">${jmlBab} Bab ▶️</span>
          </button>`;
      }).join("");

      document.getElementById("app").innerHTML = `
        <div class="top-bar">
          <button class="bg-kembali" onclick="tampilBeranda()">⬅️ Ganti Kelas</button>
          <div class="star-bar">👤 ${namaSiswa} • Kelas ${kelasAktif}</div>
        </div>
        <div class="card">
          <h2 style="color:#0284c7; font-size:1.22rem; margin-bottom:4px;">Mata Pelajaran Kelas ${kelasAktif}</h2>
          <p style="color:#64748b; font-size:0.85rem;">Pilih mata pelajaran untuk melihat daftar Bab</p>
        </div>
        ${tombolMapelHTML}`;
    }

        function tampilMenuBab(kodeMapel) {
      mainkanEfek('klik');
      mapelAktif = kodeMapel;
      const daftarBab = window.DATA_SEDDUR[kelasAktif][kodeMapel];
      const infoMapel = daftarNamaMapel[kodeMapel];

      ucapkan(`Pilih Bab pada pelajaran ${infoMapel.judul}`);

      let tombolBabHTML = daftarBab.map((babObj, idx) => `
        <button class="menu-btn bab-btn" onclick="mulaiBab(${idx})">
          <div>
            <div style="font-size:0.75rem; color:#0284c7;">${babObj.semester}</div>
            <div>${babObj.bab}</div>
          </div>
          <span class="bab-badge">${babObj.soal.length} Soal ▶️</span>
        </button>`).join("");

      document.getElementById("app").innerHTML = `
        <div class="top-bar">
          <button class="bg-kembali" onclick="tampilMenuMapel()">⬅️ Mapel</button>
          <div class="star-bar">Kelas ${kelasAktif} • ${infoMapel.judul}</div>
        </div>
        <div class="card">
          <div style="font-size:2.4rem; margin-bottom:4px;">${infoMapel.ikon}</div>
          <h2 style="color:#0284c7; font-size:1.18rem;">Daftar Bab ${infoMapel.judul}</h2>
          <p style="color:#64748b; font-size:0.84rem;">Kurikulum Merdeka Tahun Ajaran 2026/2027</p>
        </div>
        ${tombolBabHTML}`;
    }

    function mulaiBab(idxBab) {
      mainkanEfek('klik');
      babAktif = idxBab;
      const babObj = window.DATA_SEDDUR[kelasAktif][mapelAktif][idxBab];

      soalPermainan = acakArray(babObj.soal).map(item => {
        const jawabanBenar = item.opsi[item.kunci];
        const opsiAcak = acakArray(item.opsi);
        return {
          ikon: item.ikon,
          tanya: item.tanya,
          opsi: opsiAcak,
          kunci: opsiAcak.indexOf(jawabanBenar),
          bahas: item.bahas
        };
      });

      indeksSoal = 0; skorTotal = 0; jumlahBenar = 0; comboBenar = 0;
      tampilPertanyaan();
    }

    function tampilPertanyaan() {
      if (indeksSoal >= soalPermainan.length) {
        tampilSertifikat();
        return;
      }

      sudahMenjawab = false;
      const s = soalPermainan[indeksSoal];
      const babObj = window.DATA_SEDDUR[kelasAktif][mapelAktif][babAktif];
      const persen = Math.round((indeksSoal / soalPermainan.length) * 100);

      if (kelasAktif <= 3) ucapkan(s.tanya);

      let opsiHTML = s.opsi.map((teks, idx) =>
        `<button class="opsi-btn" id="pilihan-${idx}" onclick="periksaJawaban(${idx})">${teks}</button>`
      ).join("");

      document.getElementById("app").innerHTML = `
        <div class="top-bar">
          <button class="bg-kembali" onclick="tampilMenuBab('${mapelAktif}')">⬅️ Bab</button>
          <div class="star-bar">⭐ ${skorTotal} | ${indeksSoal + 1}/${soalPermainan.length}</div>
        </div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${persen}%"></div></div>
        <div class="card">
          <div style="font-size:0.8rem; font-weight:700; color:#0284c7; margin-bottom:4px;">
            Kelas ${kelasAktif} • ${babObj.bab}
          </div>
          ${comboBenar >= 2 ? `<div class="combo-badge">🔥 Combo Benar ${comboBenar}x! (+Bonus)</div>` : ''}
          <div class="visual-box">
            <span class="visual-ikon anim-bounce">${s.ikon}</span>
            ${s.tanya}
          </div>
          <button class="btn-suara" onclick="ucapkan('${s.tanya.replace(/'/g, "")}')">🔊 Dengarkan Soal</button>
          <div class="opsi-grid">${opsiHTML}</div>
          <div id="areaPembahasan"></div>
        </div>`;
    }

    function periksaJawaban(pilihan) {
      if (sudahMenjawab) return;
      sudahMenjawab = true;

      const s = soalPermainan[indeksSoal];
      const btnPilih = document.getElementById("pilihan-" + pilihan);
      const btnBenar = document.getElementById("pilihan-" + s.kunci);

      if (pilihan === s.kunci) {
        btnPilih.classList.add("benar");
        jumlahBenar++; comboBenar++;
        const bonus = comboBenar >= 3 ? 20 : (comboBenar === 2 ? 10 : 0);
        skorTotal += (100 + bonus);
        mainkanEfek('benar');
        ucapkan(`Hebat ${namaSiswa}! Jawabanmu benar!`);
        setTimeout(() => { indeksSoal++; tampilPertanyaan(); }, 1250);
      } else {
        btnPilih.classList.add("salah");
        btnBenar.classList.add("benar");
        comboBenar = 0;
        mainkanEfek('salah');
        ucapkan("Kurang tepat, yuk baca pembahasannya!");
        document.getElementById("areaPembahasan").innerHTML = `
          <div class="info-bahas">💡 <strong>Pembahasan:</strong> ${s.bahas}</div>
          <button class="btn-aksi" onclick="lanjutSoalBerikutnya()">Soal Berikutnya ➡️</button>`;
      }
    }

    function lanjutSoalBerikutnya() {
      mainkanEfek('klik');
      indeksSoal++;
      tampilPertanyaan();
    }

    function tampilSertifikat() {
      mainkanEfek('benar');
      const totalSoal = soalPermainan.length;
      const nilaiAkhir = Math.round((jumlahBenar / totalSoal) * 100);
      const infoMapel = daftarNamaMapel[mapelAktif];
      const babObj = window.DATA_SEDDUR[kelasAktif][mapelAktif][babAktif];

      let gelar = "Pejuang Tangguh SDN Seddur 1";
      let ikonGelar = "💪😊";
      let ucapanSkor = `Semangat terus ${namaSiswa}! Nilai kamu ${nilaiAkhir}. Yuk coba ulangi lagi agar semakin mahir!`;

      if (nilaiAkhir >= 85) {
        gelar = "Profesor Cilik SDN Seddur 1";
        ikonGelar = "🏆👑";
        ucapanSkor = `Luar biasa ${namaSiswa}! Kamu meraih nilai ${nilaiAkhir} dan mendapatkan gelar Profesor Cilik SDN Seddur 1!`;
      } else if (nilaiAkhir >= 65) {
        gelar = "Jagoan Hebat SDN Seddur 1";
        ikonGelar = "🌟🎖️";
        ucapanSkor = `Mantap sekali ${namaSiswa}! Nilai kamu ${nilaiAkhir}. Sedikit lagi menuju nilai sempurna!`;
      }

      ucapkan(ucapanSkor);

      document.getElementById("app").innerHTML = `
        <div class="card">
          <div class="sertifikat">
            <div style="font-size:3.5rem;" class="anim-bounce">${ikonGelar}</div>
            <div style="font-size:0.82rem; font-weight:700; color:#b45309; letter-spacing:1px; margin-top:4px;">SERTIFIKAT HASIL BELAJAR (TA 2026/2027)</div>
            <h2 style="color:#0284c7; font-size:1.35rem; margin:6px 0;">${namaSiswa}</h2>
            <p style="font-size:0.95rem; font-weight:700; color:#15803d; margin-bottom:8px;">🏅 ${gelar}</p>
            <div style="background:#ffffff; border-radius:14px; padding:10px; border:2px solid #fde68a; font-size:0.9rem; color:#334155; text-align:left;">
              <div><strong>Sekolah:</strong> SDN Seddur 1</div>
              <div><strong>Kelas / Mapel:</strong> Kelas ${kelasAktif} • ${infoMapel.judul}</div>
              <div><strong>Materi:</strong> ${babObj.bab}</div>
              <div><strong>Jawaban Benar:</strong> ${jumlahBenar} dari ${totalSoal} Soal</div>
              <div style="font-size:1.25rem; font-weight:700; color:#d97706; margin-top:6px; text-align:center;">Nilai Akhir: ${nilaiAkhir} (Skor: ${skorTotal})</div>
            </div>
          </div>
          <button class="btn-aksi" onclick="mulaiBab(${babAktif})">🔄 Ulangi Bab Ini (Acak Soal)</button>
          <br><br>
          <button class="bg-kembali" onclick="tampilMenuBab('${mapelAktif}')">📖 Pilih Bab Lain</button>
          <button class="bg-kembali" onclick="tampilMenuMapel()">📚 Ganti Mapel</button>
        </div>`;
    }

    tampilBeranda();
  </script>
